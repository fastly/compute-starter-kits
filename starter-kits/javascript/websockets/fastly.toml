# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = ["oss@fastly.com"]
description = "Implements WebSockets passthrough"
language = "javascript"
manifest_version = 3
name = "WebSockets passthrough in JavaScript"

[catalog]
topics = ["real-time"]

[scripts]
build = "npm run build"
post_init = "npm install"

[local_server]
[local_server.backends]
[local_server.backends.backend]
url = "https://echo.websocket.org/"
override_host = "echo.websocket.org"

[setup.backends]
[setup.backends.backend]

[setup.products]
[setup.products.websockets]
enable = true
