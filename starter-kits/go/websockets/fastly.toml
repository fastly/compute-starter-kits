# This file describes a Fastly Compute package. To learn more visit:
# https://developer.fastly.com/reference/fastly-toml/

authors = ["oss@fastly.com"]
description = "Implements WebSockets passthrough"
language = "go"
manifest_version = 3
name = "WebSockets passthrough in Go"

[catalog]
topics = ["real-time"]

[scripts]
env_vars = ["GOARCH=wasm", "GOOS=wasip1"]
build = "go build -o bin/main.wasm ."
post_init = "go get github.com/fastly/compute-sdk-go@latest"

[local_server]
[local_server.backends]
[local_server.backends.backend]
url = "https://echo.websocket.org/"
override_host = "echo.websocket.org"

[setup.backends]
[setup.backends.backend]

[setup.products]
[setup.products.websockets]
enable = true
